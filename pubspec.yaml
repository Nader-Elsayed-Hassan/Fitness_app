name: fitness_app
description: "Fitness Pro - A professional fitness tracking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  get_it: ^8.0.2
  go_router: ^14.6.2
  equatable: ^2.0.5
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
